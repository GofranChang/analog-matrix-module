description: GPIO keyboard demux controller

compatible: "zmk,kscan-ec-matrix"

include: ["zmk,kscan-analog-matrix.yaml", pinctrl-device.yaml]

properties:
  skip-startup-calibration:
    type: boolean
  matrix-warm-up-us:
    type: int
  matrix-relax-us:
    type: int
  adc-read-settle-us:
    type: int
  power-gpios:
    type: phandle-array
  power-off-gpios:
    type: phandle-array
    description: |
      Control GPIOs connected to the power-gated matrix circuitry. Drive these
      physically low before turning power-gpios off to avoid input-clamp
      back-powering. Only use pins for which physical low is safe while the
      matrix is powered down. The configured active polarity is ignored when
      parking these pins; use the same active polarity as the pin's existing
      controller so GPIO configuration does not change its logical behavior.
      Normal scan-time control remains with the mux driver.
  input-gpios:
    type: phandle-array
    required: true
  strobe-gpios:
    type: phandle-array
    required: true
  strobe-input-masks:
    type: array
    description: Array of masked inputs for each strobe line. Those set bits are indexes of inputs to skip for each strobe line.
  drain-gpios:
    type: phandle-array
  io-channels:
    required: true
  
  pinctrl-0:
    required: false
  pinctrl-names:
    required: false
